[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavefront-starter"
version = "0.2.0"
description = "Source-traceable X-ray wavefront sensing teaching adapters"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.13.1", "matplotlib==3.9.2", "PyWavelets==1.7.0", "numba==0.60.0", "h5py==3.11.0", "Pillow==10.4.0", "colorama==0.4.6"]

[project.scripts]
wfs-starter = "wfs_starter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wfs_starter = ["web/*.html", "web/*.json"]
