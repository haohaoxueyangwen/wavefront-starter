<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>波前工作台 · Wavefront Starter</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true">W</span><div><h1>波前工作台</h1><small>同一份数据，按需调用算法</small></div></div><div class="header-right"><span id="connection" class="badge">连接中</span><a href="https://github.com/haohaoxueyangwen/wavefront-starter/blob/main/docs/08_interfaces.md" target="_blank" rel="noopener">使用指南 ↗</a></div></header>
<div class="shell">
<nav aria-label="功能导航"><p class="nav-label">工作区</p><button data-group="speckle" class="nav-item selected"><span>散斑追踪</span><small>WXST / WSVT</small></button><button data-group="grating" class="nav-item"><span>光栅恢复</span><small>Fourier 侧带</small></button><button data-group="hartmann" class="nav-item"><span>Hartmann</span><small>网格质心位移</small></button><button data-group="zernike" class="nav-item"><span>波前分析</span><small>Zernike 分解</small></button><div class="nav-bottom"><p>数据与结果保存在本机</p><button id="historyToggle" aria-expanded="false">任务记录 <span id="historyCount">0</span></button><button id="retry" hidden>重新连接服务</button></div></nav>
<main>
<div class="page-title"><div><div class="eyebrow">数据 → 算法 → 结果</div><h2 id="workspaceTitle">散斑追踪</h2></div><div class="page-actions"><button id="demo">试用示例</button><button id="run" class="primary">运行算法</button><button id="stop" hidden>停止</button></div></div>
<div id="status" role="status" aria-live="polite" class="status">正在连接本地服务…</div>
<section id="historyPanel" class="card" hidden><div class="section-head"><h3>任务记录</h3><button id="historyClose" class="quiet">收起</button></div><div id="history" class="history"></div></section>
<div class="workspace-grid">
<div class="settings">
<section class="card"><div class="section-head"><h3><span class="step">1</span> 数据</h3><button id="import" class="quiet">导入配置</button><input id="file" type="file" accept=".json,application/json" hidden></div><label>数据目录<input id="base" type="text" placeholder="本机数据所在目录"></label><div id="dataFields" class="fields"></div><p id="dataHelp" class="help"></p><details id="correction"><summary>暗场与平场校正 <span>可选</span></summary><div id="correctionFields" class="fields"></div></details></section>
<section class="card"><div class="section-head"><h3><span class="step">2</span> 算法与参数</h3></div><label id="modeLabel">散斑算法<select id="mode" aria-label="处理方法"><option value="wxst">WXST · 单对图 / 空间模板</option><option value="wsvt">WSVT · 配对帧 / 时间向量</option></select></label><p id="methodHelp" class="help"></p><div id="paramFields" class="fields two"></div><details id="advanced"><summary>标定与高级设置 <span id="advancedHint"></span></summary><div id="advancedFields" class="fields two"></div><div class="row tools"><button id="reset" class="quiet">重置本算法参数</button><button id="export" class="quiet">导出配置</button></div><details><summary>完整配置 JSON</summary><textarea id="config" spellcheck="false" aria-label="配置 JSON"></textarea><button id="apply">应用 JSON</button></details></details></section>
</div>
<section class="card result-card"><div class="section-head"><h3><span class="step">3</span> 结果</h3><span id="resultLabel" class="badge">等待运行</span></div><div id="empty" class="empty"><div class="wave" aria-hidden="true">∿</div><h4>先选数据，再运行算法</h4><p>也可以点击右上角“试用示例”，先看一次完整流程。</p></div><div id="resultBody" hidden><p id="resultScope" class="help"></p><div id="nextStep" class="next-step" hidden><div><strong>继续分析这张波前</strong><small>将恢复相位接入 Zernike，保留单位与来源。</small></div><button id="analyze">Zernike 分解 →</button></div><div id="gallery" class="gallery"></div><details id="filesPanel"><summary>数据文件与本次配置</summary><div id="downloads" class="downloads"></div><button id="reuse">载入本次输入与参数</button></details></div><details id="logPanel"><summary>运行日志与输出位置</summary><code id="output"></code><pre id="log" aria-label="运行日志">等待运行。</pre></details></section>
</div>
<footer><span id="workspace"></span><span>本机 CPU · 每次运行创建独立结果</span></footer>
</main></div><script src="/app.js" defer></script></body></html>
